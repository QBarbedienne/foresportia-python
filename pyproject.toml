[build-system]
requires = ["setuptools>=69,<77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foresportia"
version = "0.1.0"
description = "Official Python SDK for the Foresportia API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Quentin Barbedienne", email = "contact@foresportia.com" }
]
keywords = ["foresportia", "football", "soccer", "analytics", "api", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "build",
  "pytest",
  "respx",
  "twine",
]

[project.urls]
Homepage = "https://www.foresportia.com"
Documentation = "https://www.foresportia.com/en/developers.html"
Dashboard = "https://www.foresportia.com/en/api-dashboard.html"
Repository = "https://github.com/QBarbedienne/foresportia-python"
Issues = "https://github.com/QBarbedienne/foresportia-python/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["foresportia*"]

[tool.setuptools.package-data]
foresportia = ["py.typed"]
