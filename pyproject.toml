[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foresportia"
version = "0.1.0b1"
description = "Python SDK for the Foresportia API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Foresportia" }
]
keywords = ["foresportia", "football", "soccer", "analytics", "api", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "build",
  "pytest",
  "respx",
  "twine",
]

[project.urls]
Homepage = "https://www.foresportia.com"
Documentation = "https://www.foresportia.com/en/developers.html"
Dashboard = "https://www.foresportia.com/en/api-dashboard.html"
Source = "https://github.com/QBarbedienne/foresportia-python"

[tool.hatch.build.targets.wheel]
packages = ["src/foresportia"]
